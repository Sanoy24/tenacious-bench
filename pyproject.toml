[project]
name = "tenacious-bench"
version = "0.1.0"
description = "Tenacious-Bench: Sales agent evaluation benchmark and training pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = "CC-BY-4.0"
dependencies = [
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "openai>=1.30.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ARG", "PT"]
ignore = []

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
